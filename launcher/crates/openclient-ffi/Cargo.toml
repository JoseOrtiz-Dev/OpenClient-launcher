[package]
name = "openclient-ffi"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openclient-core = { path = "../openclient-core" }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Solo para construir jars de prueba en memoria (ya está en el árbol por openclient-core).
zip = { version = "9.2", default-features = false, features = ["deflate"] }
