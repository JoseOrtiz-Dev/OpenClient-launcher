[package]
name = "openclient-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "Servicios de OpenClient independientes de la interfaz"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v3", "v4"] }
md-5 = "0.10"
sysinfo = "0.31"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
sha1 = "0.10"
zip = { version = "9.2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
